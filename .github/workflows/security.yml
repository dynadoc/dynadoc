name: Security

# Dependency vulnerability gates, complementary to Dependabot alerts:
#   - on pull requests, dependency-review blocks a PR that *adds* a dependency
#     with a known critical vulnerability;
#   - on main and every Monday, `npm audit` re-checks the whole lockfile
#     against the advisory database, so a CVE published after a merge is
#     surfaced even if nobody touches the repository.
#
# Both gates fail on `critical` only. Known high findings without a drop-in
# fix (electron major, xlsx) are listed in the job log
# and in SECURITY.md under "Known dependency advisories"; a `high` gate would
# fail every PR that touches them, including Dependabot's own patch bumps.
# Tighten both to `high` once they are cleared.

on:
  pull_request:
  push:
    branches: ['main']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
          comment-summary-in-pr: never

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Full report (informational)
        run: npm audit --package-lock-only || true
      - name: Gate on critical vulnerabilities
        run: npm audit --package-lock-only --audit-level=critical
