name: Web image

# Builds and publishes the web image from this repository alone.
#
# Production serves it: `gitops-dynadoc/apps/hub-ch/dynadoc-web.yaml` pins
# this image by commit SHA. Actions on the private client's account is blocked
# on billing, so this is the only pipeline that can produce a web image at all.
#
# No personal access token anywhere: the source and the registry share this
# repository's owner, so the built-in GITHUB_TOKEN suffices. That invariant is
# load-bearing and it has been broken once. While this repository lived under a
# different organisation than the registry, every run failed on
# `denied: permission` for five days -- the build itself was green and only the
# push was refused, so the failure looked like a build problem and was not. If
# this repository ever moves again, the registry owner moves with it.

on:
  push:
    branches: ['main']
    paths:
      - 'deploy/web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/web-image.yml'
  pull_request:
    paths:
      - 'deploy/web/**'
      - '.github/workflows/web-image.yml'
  # A published release, which is what Release Please creates when its PR is
  # merged. Keyed on the release rather than on the tag push, because a push
  # trigger carrying `paths` filters the tag event against the same paths and
  # a fresh tag can produce an empty diff -- the build would then be skipped
  # silently, which is the one failure a release build must not have.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build the web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The built-in token, scoped by `packages: write` above. No personal
      # access token: a publish that depends on one person's credentials stops
      # working the day that person's token is rotated.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # load: false keeps the result in the build cache instead of the daemon.
      # Nothing consumes the image yet, so there is no reason to materialise it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Two tags, and the commit one is what production pins to: `latest`
          # moves under a running deployment, so a pod restart would otherwise
          # decide on its own what to serve. The commit tag is immutable and
          # traces a running image back to the source it was built from.
          #
          # The owner is lowercased here rather than interpolated: a registry
          # repository name must be lowercase, and this organisation is spelled
          # with capitals, so ${{ github.repository_owner }} produces a tag the
          # builder rejects outright. That is what the first run of this gate
          # found, which is a fair result for a gate whose job is to find things.
          #
          # On a published release, the version tag is added alongside. An
          # empty line is ignored by the builder, so the expression collapses
          # to nothing on an ordinary push.
          tags: |
            ghcr.io/dynadoc/dynadoc-web:${{ github.sha }}
            ghcr.io/dynadoc/dynadoc-web:latest
            ${{ github.event_name == 'release' && format('ghcr.io/dynadoc/dynadoc-web:{0}', github.event.release.tag_name) || '' }}

      # Prévenir le dépôt de déploiement qu'une image de release existe, pour
      # qu'il épingle ce SHA exact et laisse ArgoCD faire le reste.
      #
      # UNIQUEMENT sur une release publiée. Un push ordinaire sur `main` ne doit
      # pas atteindre la production : le 8 novembre, cinq PR y sont parties sans
      # qu'aucune CI n'ait tourné dessus, et le geste manuel était alors la
      # dernière porte. Elle se déplace sur le merge de la PR de release, elle
      # ne disparaît pas.
      #
      # La cible est un secret, pas une valeur écrite ici. Ce dépôt est public :
      # le nom du dépôt de déploiement n'a pas à y figurer.
      #
      # Sans le secret, l'étape prévient et sort sans échouer. Une image publiée
      # reste une image publiée, et faire rougir la construction pour une
      # promotion non configurée induirait en erreur.
      # Un jeton d'installation d'App expire au bout d'une heure : une valeur
      # collée dans un secret serait morte le lendemain. On le fabrique donc à
      # la volée depuis l'identifiant de l'App et sa clé privée, qui eux ne
      # périment pas. Une App plutôt qu'un jeton personnel, pour que la chaîne
      # ne meure pas avec un compte.
      - name: Mint a short-lived token for the deployment repository
        id: deploy_token
        if: success() && github.event_name == 'release' && vars.DEPLOY_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ secrets.DEPLOY_DISPATCH_OWNER }}
          repositories: ${{ secrets.DEPLOY_DISPATCH_NAME }}

      # Prévenir le dépôt de déploiement qu'une image de release existe, pour
      # qu'il épingle ce SHA exact et laisse ArgoCD faire le reste.
      #
      # UNIQUEMENT sur une release publiée. Un push ordinaire sur `main` ne doit
      # pas atteindre la production : le geste manuel qu'on remplace ici était
      # la dernière porte, et elle se déplace sur le merge de la PR de release
      # plutôt que de disparaître.
      #
      # La cible est un secret, pas une valeur écrite ici. Ce dépôt est public :
      # le nom du dépôt de déploiement n'a pas à y figurer.
      #
      # Sans la configuration, l'étape prévient et sort sans échouer. Une image
      # publiée reste une image publiée, et faire rougir la construction pour
      # une promotion non configurée induirait en erreur.
      - name: Tell the deployment repository
        if: success() && github.event_name == 'release'
        env:
          TOKEN: ${{ steps.deploy_token.outputs.token }}
          OWNER: ${{ secrets.DEPLOY_DISPATCH_OWNER }}
          NAME: ${{ secrets.DEPLOY_DISPATCH_NAME }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ] || [ -z "${OWNER}" ] || [ -z "${NAME}" ]; then
            echo "::warning::Promotion non configurée (DEPLOY_APP_ID, DEPLOY_APP_PRIVATE_KEY, DEPLOY_DISPATCH_OWNER, DEPLOY_DISPATCH_NAME). Le deploiement n'a pas ete declenche, epinglez le tag a la main."
            exit 0
          fi
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OWNER}/${NAME}/dispatches" \
            -d "{\"event_type\":\"web-image-published\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\",\"version\":\"${VERSION}\"}}")"
          if [ "${CODE}" != "204" ]; then
            echo "::error::Le depot de deploiement a repondu ${CODE}. L'image est publiee mais rien n'est epingle."
            exit 1
          fi
          echo "Deploiement declenche pour ${VERSION} (${GITHUB_SHA})."
