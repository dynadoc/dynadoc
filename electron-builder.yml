appId: com.dynadoc.app
productName: dynadoc
# Required for the OAuth deep link to reach packaged builds. On macOS,
# app.setAsDefaultProtocolClient() alone is not enough: Launch Services only
# routes dynadoc:// to a bundle that declares the scheme (CFBundleURLTypes),
# which electron-builder generates from this block.
protocols:
  - name: Dynadoc
    schemes:
      - dynadoc
fileAssociations:
  - ext: xddoc
    name: Dynadoc Document
    role: Editor
    icon: build/icon
  - ext: sddoc
    name: Dynadoc Secured Document
    role: Editor
    icon: build/icon
directories:
  buildResources: build
files:
  # - "out/**/*"                         # ← CRITICAL: Include electron-vite's output folder (change to "dist/**/*" if using dist)
  # - "package.json"                     # ← CRITICAL: Always include package.json at the bundle root
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asar: true
# Unpack binaries so they can be executed by the OS
asarUnpack:
  - '**/bin/**/*'

win:
  executableName: dynadoc
  extraResources:
    - from: resources/bin/win
      to: bin/win
    - from: resources/languagetool # Included in all
      to: languagetool

mac:
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  # Logic to handle Intel vs ARM specific folders if building separately
  extraResources:
    - from: resources/bin/mac
      to: bin/mac
    - from: resources/languagetool
      to: languagetool
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
linux:
  target:
    - AppImage
    - snap
    - deb
  extraResources:
    - from: resources/bin/linux
      to: bin/linux
    - from: resources/languagetool
      to: languagetool
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

dmg:
  artifactName: ${name}-${version}.${ext}

appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
# The Electron runtime download pointed at a third-party mirror while no
# `checksums` were pinned. @electron/get then fetches SHASUMS256.txt from that
# SAME mirror base, so the mirror certified its own artefact: a tampered
# runtime served with a matching checksum file validated, and the result was
# packaged into a build that is unsigned on macOS with no fuses configured.
# The pinned npm integrity in package-lock.json anchors the downloader
# package, never the binary it fetches.
#
# Removed, so the download goes to the upstream release host. If a mirror is
# ever needed for build speed, keep it AND add `electronDownload.checksums`
# with digests taken from upstream -- that selects the branch in @electron/get
# which writes the checksum file locally from the pinned values instead of
# downloading it from the mirror.
# Global extraResources removed to prevent duplication/bloat

# extraResources:
#   # - from: resources/bin
#   #   to: bin
#   - from: resources/
#     to: .
